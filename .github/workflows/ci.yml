name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-core:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      UPSTREAM_API_KEY: ""
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          architecture: x64
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Repository checks
        run: |
          python -B scripts/check_repository.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B scripts/test_repository_checks.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git show --format= --check HEAD
      - name: Install locked environments
        run: |
          python -m venv .venv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.lock.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m venv --without-pip .venv-litellm
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip --python .venv-litellm\Scripts\python.exe install --require-hashes --only-binary=:all: -r spikes\litellm_p0\requirements-win-py313.lock.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\.venv-litellm\Scripts\python.exe -I -S scripts\start_p1.py --check
      - name: Python lint and format
        run: |
          .\.venv\Scripts\python.exe -m ruff check .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m ruff format --check .
      - name: Backend tests
        run: .\.venv\Scripts\python.exe -B scripts\test_core.py
      - name: LiteLLM contracts with fake upstream
        run: .\.venv\Scripts\python.exe -B scripts\test_core.py --contracts
      - name: Offline model access demonstration
        run: .\.venv-litellm\Scripts\python.exe -I -S scripts\demo_access.py
      - name: Frontend build and browser tests
        working-directory: console_ui
        run: |
          npm.cmd ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm.cmd run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm.cmd test
      - name: Save synthetic test summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-summaries
          path: |
            .cache/core-tests.xml
            .cache/contracts.json
            .cache/access-demo/**/result.json
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
