name: Bug report
description: 报告可复现的问题
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: 当前行为与预期行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 使用合成数据，移除凭据和客户信息。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境与提交
      description: Windows、Python、Node 版本及 Git 提交编号。
    validations:
      required: true
